<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YouTube Length Sorter</title>

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <!-- Tailwind CDN with dark mode support -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .spinner {
      border: 4px solid rgba(0,0,0,0.1);
      border-left-color: #000;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }
    .dark .spinner {
      border: 4px solid rgba(255,255,255,0.1);
      border-left-color: #fff;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-50 transition-colors">

  <div class="max-w-5xl mx-auto px-4 py-10">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-semibold">
        YouTube Video Length Sorter
      </h1>
      <button
        id="darkModeToggle"
        onclick="toggleDarkMode()"
        class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition"
        title="Toggle dark mode"
      >
        <svg class="w-5 h-5 block dark:hidden" fill="currentColor" viewBox="0 0 20 20">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
        </svg>
        <svg class="w-5 h-5 hidden dark:block" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.536l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.828-2.828a1 1 0 011.414 0l.707.707a1 1 0 11-1.414 1.414l-.707-.707a1 1 0 010-1.414zm.464-4.536l.707-.707a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414zm-2.828 2.828a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 1.414l-.707.707zm2.828 2.828a1 1 0 001.414-1.414l-.707-.707a1 1 0 10-1.414 1.414l.707.707zM3 12a1 1 0 110-2 1 1 0 010 2zm16 0a1 1 0 110-2 1 1 0 010 2zm-15-8a1 1 0 100 2 1 1 0 000-2zm0 16a1 1 0 100 2 1 1 0 000-2z" clip-rule="evenodd"></path>
        </svg>
      </button>
    </div>

    <div class="flex gap-2 mb-8">
      <input
        id="channelInput"
        type="text"
        placeholder="Paste YouTube channel URL"
        class="flex-1 border rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-black dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:focus:ring-white"
      />
      <button
        onclick="loadVideos(1)"
        class="bg-black text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-800 transition dark:bg-white dark:text-black dark:hover:bg-gray-200"
      >
        Fetch
      </button>
    </div>

    <div id="results" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>

    <!-- Pagination Controls -->
    <div id="paginationContainer" class="mt-8 flex items-center justify-center gap-2 hidden">
      <button
        id="prevBtn"
        onclick="previousPage()"
        class="px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800 transition disabled:opacity-50 disabled:cursor-not-allowed"
      >
        ← Previous
      </button>
      <span id="pageInfo" class="text-sm text-gray-600 dark:text-gray-400 mx-4">Page 1</span>
      <button
        id="nextBtn"
        onclick="nextPage()"
        class="px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800 transition disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Next →
      </button>
    </div>
  </div>

<script>
let currentPage = 1;
let totalPages = 1;
let currentChannelUrl = "";
const ITEMS_PER_PAGE = 12;

function toggleDarkMode() {
  const isDark = document.documentElement.classList.toggle("dark");
  localStorage.setItem("darkMode", isDark ? "true" : "false");
}

// Load dark mode preference on page load
if (localStorage.getItem("darkMode") === "true") {
  document.documentElement.classList.add("dark");
} else if (!localStorage.getItem("darkMode")) {
  // Default to system preference
  if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
    document.documentElement.classList.add("dark");
    localStorage.setItem("darkMode", "true");
  }
}

async function loadVideos(page = 1) {
  const input = document.getElementById("channelInput");
  const results = document.getElementById("results");

  currentChannelUrl = input.value;
  currentPage = page;

  results.innerHTML = `
    <div class="col-span-full flex items-center gap-2 text-gray-500 dark:text-gray-400 text-sm">
      <div class="spinner"></div>
      Loading videos...
    </div>
  `;

  try {
    const res = await fetch("/videos", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        channelUrl: currentChannelUrl,
        page: page,
        itemsPerPage: ITEMS_PER_PAGE
      })
    });

    const data = await res.json();
    if (data.error) {
      results.innerHTML = `
        <div class="col-span-full text-sm text-red-600 dark:text-red-400">
          ${data.error}
        </div>
      `;
      document.getElementById("paginationContainer").classList.add("hidden");
      return;
    }

    totalPages = data.totalPages;
    const videos = data.videos;

    results.innerHTML = "";

    videos.forEach(v => {
      const hours = Math.floor(v.duration / 3600);
      const minutes = Math.floor((v.duration % 3600) / 60);
      const durationLabel =
        (hours > 0 ? `${hours}h ` : "") + `${minutes}m`;

      const videoLink = `https://www.youtube.com/watch?v=${v.videoId}`;

      results.innerHTML += `
        <a
          href="${videoLink}"
          target="_blank"
          rel="noopener noreferrer"
          class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden hover:shadow-md transition cursor-pointer"
        >
          <div class="relative aspect-video">
            <img
              src="${v.thumbnail}"
              alt="${v.title}"
              class="w-full h-full object-cover"
            />
            <span class="absolute bottom-2 right-2 bg-black/80 text-white text-xs px-2 py-1 rounded">
              ${durationLabel}
            </span>
          </div>

          <div class="p-3">
            <div class="text-sm font-medium leading-snug line-clamp-2 dark:text-white">
              ${v.title}
            </div>
          </div>
        </a>
      `;
    });

    if (videos.length === 0) {
      results.innerHTML = `
        <div class="col-span-full text-sm text-gray-500 dark:text-gray-400">
          No videos found.
        </div>
      `;
    }

    // Update pagination controls
    updatePaginationControls();

  } catch (err) {
    results.innerHTML = `
      <div class="col-span-full text-sm text-red-600 dark:text-red-400">
        Error fetching videos: ${err.message}
      </div>
    `;
    document.getElementById("paginationContainer").classList.add("hidden");
  }
}

function updatePaginationControls() {
  const container = document.getElementById("paginationContainer");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const pageInfo = document.getElementById("pageInfo");

  if (totalPages <= 1) {
    container.classList.add("hidden");
    return;
  }

  container.classList.remove("hidden");
  pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
  prevBtn.disabled = currentPage === 1;
  nextBtn.disabled = currentPage === totalPages;
}

function nextPage() {
  if (currentPage < totalPages) {
    loadVideos(currentPage + 1);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function previousPage() {
  if (currentPage > 1) {
    loadVideos(currentPage - 1);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}
</script>

</body>
</html>
